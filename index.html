<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skynovatech Forms</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: #1e2a3a; color: white; padding: 40px 0; text-align: center; margin-bottom: 30px; }
        .nav-pills .nav-link { border-radius: 50px; padding: 10px 25px; margin: 0 5px; color: #495057; font-weight: 500; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
        .form-section { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="hero">
    <h2>Skynovatech Portal</h2>
    <p class="mb-0 text-white-50">Select a form below to submit your request or application.</p>
</div>

<div class="container pb-5">
    <!-- Tabs Navigation -->
    <ul class="nav nav-pills justify-content-center mb-5" id="formTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="contact-tab" data-bs-toggle="pill" data-bs-target="#contact" type="button" role="tab">Contact Us</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="quote-tab" data-bs-toggle="pill" data-bs-target="#quote" type="button" role="tab">Get a Quote</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="intern-tab" data-bs-toggle="pill" data-bs-target="#intern" type="button" role="tab">Internship</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="newsletter-tab" data-bs-toggle="pill" data-bs-target="#newsletter" type="button" role="tab">Newsletter</button>
        </li>
    </ul>

    <!-- Tabs Content -->
    <div class="tab-content" id="formTabsContent">
        
        <!-- 1. Contact Form -->
        <div class="tab-pane fade show active" id="contact" role="tabpanel">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="form-section border-top border-primary border-5">
                        <h4 class="mb-4 text-center">Contact Us</h4>
                        <div id="contactAlert" class="alert d-none" role="alert"></div>
                        <form id="contactForm" onsubmit="return submitContact(event)">
                            <div class="row g-3">
                                <div class="col-md-6"><label class="form-label">Your Name</label><input type="text" class="form-control" id="contactName" required></div>
                                <div class="col-md-6"><label class="form-label">Your Email</label><input type="email" class="form-control" id="contactEmail" required></div>
                                <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" id="contactPhone"></div>
                                <div class="col-md-6"><label class="form-label">Subject</label><input type="text" class="form-control" id="contactSubject" required></div>
                                <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" id="contactMessage" rows="5" required></textarea></div>
                                <div class="col-12 text-center mt-4"><button type="submit" class="btn btn-primary px-5" id="contactBtn">Send Message</button></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Quote Form -->
        <div class="tab-pane fade" id="quote" role="tabpanel">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="form-section border-top border-dark border-5">
                        <h4 class="mb-4 text-center">Request a Free Quote</h4>
                        <div id="quoteAlert" class="alert d-none" role="alert"></div>
                        <form id="quoteForm" onsubmit="return submitQuote(event)">
                            <div class="row g-3">
                                <div class="col-md-6"><label class="form-label">Name</label><input type="text" class="form-control" id="quoteName" required></div>
                                <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="quoteEmail" required></div>
                                <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" id="quotePhone"></div>
                                <div class="col-md-6">
                                    <label class="form-label">Service Required</label>
                                    <select class="form-select" id="quoteMainService" required>
                                        <option value="" disabled selected>Select a Service</option>
                                        <option value="Web Development">Web Development</option>
                                        <option value="Mobile App Development">Mobile App Development</option>
                                        <option value="Digital Marketing">Digital Marketing</option>
                                        <option value="Software Development">Software Development</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-12"><label class="form-label">Project Details (Optional)</label><input type="text" class="form-control" id="quoteDetailedService" placeholder="e.g. E-commerce app, SEO optimization"></div>
                                <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" id="quoteMessage" rows="4"></textarea></div>
                                <div class="col-12 text-center mt-4"><button type="submit" class="btn btn-dark px-5" id="quoteBtn">Get Quote</button></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Internship Form -->
        <div class="tab-pane fade" id="intern" role="tabpanel">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="form-section border-top border-success border-5">
                        <h4 class="mb-4 text-center">Internship Application</h4>
                        <div id="internAlert" class="alert d-none" role="alert"></div>
                        <form id="internForm" onsubmit="return submitIntern(event)">
                            <h5 class="mb-3 text-success border-bottom pb-2">Personal Details</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" class="form-control" id="internName" required></div>
                                <div class="col-md-6"><label class="form-label">Email Address *</label><input type="email" class="form-control" id="internEmail" required></div>
                                <div class="col-md-6"><label class="form-label">Contact Number *</label><input type="text" class="form-control" id="internContact" required></div>
                                <div class="col-md-6"><label class="form-label">WhatsApp Number</label><input type="text" class="form-control" id="internWhatsapp"></div>
                                <div class="col-md-6"><label class="form-label">Date of Birth</label><input type="date" class="form-control" id="internDob"></div>
                                <div class="col-md-6">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" id="internGender">
                                        <option value="" disabled selected>Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <h5 class="mb-3 text-success border-bottom pb-2">Education Details</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-12"><label class="form-label">College / University Name *</label><input type="text" class="form-control" id="internCollege" required></div>
                                <div class="col-md-4"><label class="form-label">Degree</label><input type="text" class="form-control" id="internDegree" placeholder="e.g. B.Tech"></div>
                                <div class="col-md-4"><label class="form-label">Department / Branch</label><input type="text" class="form-control" id="internDepartment" placeholder="e.g. CSE"></div>
                                <div class="col-md-4">
                                    <label class="form-label">Year of Study</label>
                                    <select class="form-select" id="internYear">
                                        <option value="" disabled selected>Select</option>
                                        <option value="1st Year">1st Year</option>
                                        <option value="2nd Year">2nd Year</option>
                                        <option value="3rd Year">3rd Year</option>
                                        <option value="4th Year">4th Year</option>
                                        <option value="Passed Out">Passed Out</option>
                                    </select>
                                </div>
                            </div>

                            <h5 class="mb-3 text-success border-bottom pb-2">Preferences</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Preferred Domain *</label>
                                    <select class="form-select" id="internDomain" required>
                                        <option value="" disabled selected>Select Domain</option>
                                        <option value="Frontend Development">Frontend Development</option>
                                        <option value="Backend Development">Backend Development</option>
                                        <option value="Full Stack Development">Full Stack Development</option>
                                        <option value="Data Science">Data Science</option>
                                        <option value="Digital Marketing">Digital Marketing</option>
                                        <option value="Graphic Design">Graphic Design</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Duration</label>
                                    <select class="form-select" id="internDuration">
                                        <option value="1 Month">1 Month</option>
                                        <option value="2 Months">2 Months</option>
                                        <option value="3 Months">3 Months</option>
                                        <option value="6 Months">6 Months</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-4 text-center"><button type="submit" class="btn btn-success px-5 fw-bold" id="internBtn">Submit Application</button></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Newsletter Form -->
        <div class="tab-pane fade" id="newsletter" role="tabpanel">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="form-section border-top border-info border-5 text-center p-5">
                        <h3 class="fw-bold mb-3">Stay Updated!</h3>
                        <p class="text-muted mb-4">Subscribe to our newsletter to get the latest news and offers.</p>
                        
                        <div id="newsletterAlert" class="alert d-none" role="alert"></div>
                        
                        <form id="newsletterForm" onsubmit="return submitNewsletter(event)">
                            <div class="input-group mb-3">
                                <input type="email" class="form-control form-control-lg" id="newsletterEmail" placeholder="Enter your email" required>
                                <button class="btn btn-info text-white px-4" type="submit" id="newsletterBtn">Subscribe</button>
                            </div>
                        </form>
                        <small class="text-muted">We respect your privacy. No spam.</small>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Supabase Integration Scripts -->
<script>
    // Initialize Supabase
    if (typeof window.supabase === 'undefined') {
        alert("CRITICAL ERROR: The database script failed to load. Your browser or network might be blocking cdn.jsdelivr.net. Forms will not work until this is fixed.");
        console.error("Supabase script failed to load!");
    }
    const supabaseUrl = 'https://wctbdqunrifopbnjisxi.supabase.co';
    const supabaseKey = 'sb_publishable_q0VN3NfdSy8Gth-vH2eNeg_iUNNBX_x';
    const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

    // Helper function for form submission
    async function executeSubmit(e, formId, btnId, alertId, tableName, payload, successMessage) {
        e.preventDefault();
        
        if (!window.supabase) {
            alert("Database connection not loaded! Please refresh.");
            return false;
        }

        const btn = document.getElementById(btnId);
        const alertBox = document.getElementById(alertId);
        const originalBtnText = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = 'Submitting...';
        alertBox.classList.add('d-none');
        
        try {
            const { error } = await supabase.from(tableName).insert([payload]);

            if (error) {
                console.error('Error:', error);
                alertBox.className = 'alert alert-danger mt-3';
                alertBox.innerHTML = 'An error occurred. Please try again.';
            } else {
                alertBox.className = 'alert alert-success mt-3';
                alertBox.innerHTML = successMessage;
                document.getElementById(formId).reset();
                window.scrollTo({ top: alertBox.offsetTop - 100, behavior: 'smooth' });
            }
        } catch (err) {
            console.error('Crash:', err);
            alertBox.className = 'alert alert-danger mt-3';
            alertBox.innerHTML = 'A network error occurred.';
        }

        btn.disabled = false;
        btn.innerHTML = originalBtnText;
        return false;
    }

    // 1. Contact Form
    window.submitContact = function(e) {
        const payload = {
            name: document.getElementById('contactName').value,
            email: document.getElementById('contactEmail').value,
            phone: document.getElementById('contactPhone').value,
            subject: document.getElementById('contactSubject').value,
            message: document.getElementById('contactMessage').value,
            source: 'website_contact'
        };
        return executeSubmit(e, 'contactForm', 'contactBtn', 'contactAlert', 'lead_captures', payload, 'Your message has been sent successfully. We will get back to you soon!');
    };

    // 2. Quote Form
    window.submitQuote = function(e) {
        const payload = {
            name: document.getElementById('quoteName').value,
            email: document.getElementById('quoteEmail').value,
            phone: document.getElementById('quotePhone').value,
            main_service: document.getElementById('quoteMainService').value,
            detailed_service: document.getElementById('quoteDetailedService').value,
            message: document.getElementById('quoteMessage').value,
        };
        return executeSubmit(e, 'quoteForm', 'quoteBtn', 'quoteAlert', 'quote_requests', payload, 'Quote request received! We will contact you shortly.');
    };

    // 3. Internship Form
    window.submitIntern = function(e) {
        const payload = {
            name: document.getElementById('internName').value,
            email: document.getElementById('internEmail').value,
            contact: document.getElementById('internContact').value,
            whatsapp: document.getElementById('internWhatsapp').value,
            dob: document.getElementById('internDob').value || null,
            gender: document.getElementById('internGender').value,
            college: document.getElementById('internCollege').value,
            degree: document.getElementById('internDegree').value,
            department: document.getElementById('internDepartment').value,
            year: document.getElementById('internYear').value,
            domain: document.getElementById('internDomain').value,
            duration: document.getElementById('internDuration').value
        };
        return executeSubmit(e, 'internForm', 'internBtn', 'internAlert', 'intern_applications', payload, 'Application submitted successfully! We will review your profile.');
    };

    // 4. Newsletter Form
    window.submitNewsletter = function(e) {
        const payload = { email: document.getElementById('newsletterEmail').value };
        return executeSubmit(e, 'newsletterForm', 'newsletterBtn', 'newsletterAlert', 'newsletter_subscribers', payload, 'Thank you for subscribing!');
    };

</script>
</body>
</html>
